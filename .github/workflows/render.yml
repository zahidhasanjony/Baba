name: Render 9:16 Golden Nostalgia Video

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'Composition ID'
        required: true
        default: 'StoryShort'
      output_filename:
        description: 'Output filename'
        required: true
        default: 'baba_mithyabadi_9x16.mp4'
      is_still:
        description: 'Render thumbnail still instead of video? (true/false)'
        required: false
        default: 'false'
      frame_number:
        description: 'Frame number for still'
        required: false
        default: '90'

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Remotion Project
        run: unzip -o baba-mithyabadi-remotion-9x16-golden.zip -x ".github/*"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium & Bengali Font Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-color-emoji \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgdk-pixbuf-2.0-0 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            libasound2t64

      - name: Install Project Dependencies
        run: npm install

      - name: Ensure Headless Browser
        run: npx remotion browser ensure

      - name: Render Video or Still
        run: |
          mkdir -p out
          if [ "${{ github.event.inputs.is_still }}" = "true" ]; then
            npx remotion still "${{ github.event.inputs.composition_id }}" "out/${{ github.event.inputs.output_filename }}" \
              --frame="${{ github.event.inputs.frame_number }}" \
              --gl=angle
          else
            npx remotion render "${{ github.event.inputs.composition_id }}" "out/${{ github.event.inputs.output_filename }}" \
              --gl=angle \
              --pixel-format=yuv420p \
              --concurrency=100%
          fi

      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: baba-mithyabadi-render
          path: out/${{ github.event.inputs.output_filename }}
          retention-days: 14
